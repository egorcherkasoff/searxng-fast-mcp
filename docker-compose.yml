services:
  searxng:
    build: .
    image: searxng-fast-mcp:latest
    container_name: searxng-mcp
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SEARXNG_BASE_URL: http://localhost:8080/
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "1"
